    source_type: normative_standard
    authority_class: A
    scope: >
      Official Canonical Device Interfaces: digin, digout, adcin, adcout only.
      Encoder is NOT defined in this document. Defines pin names, types,
      directions, and parameter names for the four canonical device types.
    state: current
    inspected: true
    notes: >
      Inspected at pinned commit 71bf88009d64fa15edbebf9250b65ee4454f9a05.
      The official CDI document defines exactly four interfaces:
      digin (in, in-not), digout (out, invert), adcin (value, scale, offset,
      bit-weight, hw-offset), adcout (value, enable, offset, scale, high-limit,
      low-limit, bit-weight, hw-offset). Encoder is not a Canonical Device
      Interface; it is a hal-canon convention (see B-004).


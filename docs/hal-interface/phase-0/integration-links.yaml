# Integration Link Catalogue — Phase 0
# Each entry records the producer endpoint, consumer endpoint, HAL contract,
# and compatibility status for one PoKeys-side signal boundary with an external
# homecomp counterpart observation.
# Evidence fields are separated by source domain.
---
integration_links:

  - link_id: IK-001
    signal_function: home switch signal
    producer_object: "<prefix>.PEv2.I.digin.Home.in"
    producer_owner: pokeysHal
    producer_direction: HAL_OUT
    consumer_object: "joint.N.home-sw-in"
    consumer_owner: pokeys_homecomp
    consumer_direction: HAL_IN
    hal_type: hal_bit_t
    semantic_contract: >-
      pokeysHal reads the PoKeys device home-switch input state and drives
      <prefix>.PEv2.I.digin.Home.in (HAL_OUT). pokeys_homecomp reads this via
      joint.N.home-sw-in (HAL_IN). Net statement required in HAL/INI
      configuration.
    enum_contract: "binary bit; no enum"
    mapping_scope: HAL/INI configuration
    compatibility_status: compatible
    conflicts: []
    legacy_pokeys_endpoint_evidence: "E-009 / LA-069"
    current_pokeyshal_endpoint_evidence: "F-005"
    homecomp_endpoint_evidence: "E-010 / HOMECOMP-001"

  - link_id: IK-002
    signal_function: index-enable bidirectional signal
    producer_object: "<prefix>.PEv2.I.index-enable"
    producer_owner: pokeysHal
    producer_direction: HAL_IO
    consumer_object: "joint.N.index-enable"
    consumer_owner: pokeys_homecomp
    consumer_direction: HAL_IO
    hal_type: hal_bit_t
    semantic_contract: >-
      The pokeysHal endpoint exists and the homecomp endpoint is recorded as
      external counterpart evidence only. The runtime read/write propagation
      semantics between the PoKeys-side pin and the external counterpart are not
      traced by the Phase 0 evidence set. This link remains unverified-incomplete
      until a concrete propagation path is demonstrated in source or runtime
      evidence.
    enum_contract: "binary bit; no enum"
    mapping_scope: HAL/INI configuration (propagation untraced)
    compatibility_status: unverified-incomplete
    conflicts: []
    legacy_pokeys_endpoint_evidence: "E-009 / LA-022"
    current_pokeyshal_endpoint_evidence: "F-005"
    homecomp_endpoint_evidence: "E-010 / HOMECOMP-005"

  - link_id: IK-003
    signal_function: axis command (homecomp→pokeysHal)
    producer_object: "joint.N.PEv2.AxesCommand"
    producer_owner: pokeys_homecomp
    producer_direction: HAL_OUT
    consumer_object: "<prefix>.PEv2.I.AxesCommand"
    consumer_owner: pokeysHal
    consumer_direction: HAL_IN
    hal_type: hal_u32_t
    semantic_contract: >-
      pokeys_homecomp produces AxesCommand (HAL_OUT); pokeysHal is the
      consumer (HAL_IN). The legacy PoKeys component (E-009) is also a
      consumer (HAL_IN, LA-013) — it is not an alternative producer.
      Current pokeysHal has no reachable normal-cycle forwarding path
      from FUNCTION(_) to hardware (CONFLICT-014). Enum values are
      incompatible between homecomp 4-value and legacy 7-value contracts
      (CONFLICT-013). Integration is not functional until both conflicts
      are resolved.
    enum_contract: >-
      pokeys_homecomp: {0=IDLE, 1=HOMINGSTART, 2=HOMINGCANCEL, 3=HOMINGFINALIZE}.
      Legacy PoKeys component: {0=IDLE, 1=HOMINGSTART, 2=ARMENCODER,
      3=HOMINGWaitFinalMove, 4=HOMINGFinalMove, 5=HOMINGCancel, 6=HOMINGFinalize}.
      Value 2 incompatible (CONFLICT-013).
    mapping_scope: HAL/INI configuration
    compatibility_status: incompatible
    conflicts:
      - CONFLICT-013
      - CONFLICT-014
    legacy_pokeys_endpoint_evidence: "E-009 / LA-013 (consumer, HAL_IN)"
    current_pokeyshal_endpoint_evidence: "F-005/F-008 (consumer, HAL_IN; CONFLICT-014: no reachable forwarding path)"
    homecomp_endpoint_evidence: "E-010 / HOMECOMP-007 (producer, HAL_OUT)"

  - link_id: IK-004
    signal_function: axis state (pokeysHal→homecomp)
    producer_object: "<prefix>.PEv2.I.AxesState"
    producer_owner: pokeysHal
    producer_direction: HAL_OUT
    consumer_object: "joint.N.PEv2.AxesState"
    consumer_owner: pokeys_homecomp
    consumer_direction: HAL_IN
    hal_type: hal_u32_t
    semantic_contract: >-
      pokeysHal reads hardware axis state from the PoKeys device and writes
      it to <prefix>.PEv2.I.AxesState (HAL_OUT). pokeys_homecomp reads this
      via joint.N.PEv2.AxesState (HAL_IN) to drive its homing state machine.
      pokeys_homecomp is the consumer only; it is not part of the producer
      component.
    enum_contract: >-
      Hardware device states (ePK_PEAxisState): {0,1,2,8,9,10,11,12,13,14,15,16,20,30}.
      Legacy userspace also defines extended states PEAxisStateEx
      {3=ReadyToFinalizeHoming, 4=ReadyToArmEncoder, 17-19 extended}.
      Whether pokeys_homecomp handles values outside pokeys_home_state_t is
      unverified (see traceability.md section 13).
    mapping_scope: HAL/INI configuration
    compatibility_status: partially-compatible
    conflicts: []
    legacy_pokeys_endpoint_evidence: "E-009 / LA-012 (producer, HAL_OUT)"
    current_pokeyshal_endpoint_evidence: "F-005 (producer, HAL_OUT; PoKeysLibPulseEngine_v2Async.c:414)"
    homecomp_endpoint_evidence: "E-010 / HOMECOMP-006 (consumer, HAL_IN)"

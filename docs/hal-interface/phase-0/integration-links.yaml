  enum_contract: binary bit; no enum
  mapping_scope: HAL/INI configuration
  compatibility_status: compatible
  conflicts: []
  evidence: E-010 (LA-022 pokeys side), E-010 (HOMECOMP-005 homecomp side)
- link_id: IK-003
  description: PEv2 AxesCommand — homing command from homecomp to pokeysHal
  producer_object: joint.N.PEv2.AxesCommand
  producer_owner: pokeys_homecomp
  producer_direction: HAL_OUT
  consumer_object: <prefix>.PEv2.I.AxesCommand
  consumer_owner: pokeysHal
  consumer_direction: HAL_IN
  hal_type: hal_u32_t
  semantic_contract: AxesCommand HAL_OUT from producer should be netted to HAL_IN on pokeysHal. Legacy userspace and homecomp have incompatible enum values (CONFLICT-013). Current pokeysHal has no reachable
    path forwarding AxesCommand to hardware (CONFLICT-014). Integration is not functional until both conflicts are resolved.
  enum_contract: 'pokeys_homecomp uses {0=IDLE, 1=HOMINGSTART, 2=HOMINGCANCEL, 3=HOMINGFINALIZE}. Legacy userspace uses {0=IDLE, 1=HOMINGSTART, 2=ARMENCODER, 3=HOMINGWaitFinalMove, 4=HOMINGFinalMove, 5=HOMINGCancel,
    6=HOMINGFinalize}. Value 2 is incompatible.

    '
  mapping_scope: HAL/INI configuration
  compatibility_status: incompatible
  conflicts:
  - CONFLICT-013
  - CONFLICT-014
  evidence: E-009 LA-013 (legacy PEv2 consumer); E-010 HOMECOMP-007 (homecomp producer); F-005/F-008 current pokeysHal endpoint (no forwarding path)
  legacy_contract:
    producer: legacy userspace component or pokeys_homecomp
    producer_enum: 'legacy: 7-value; homecomp: 4-value (incompatible per CONFLICT-013)'
  current_implementation:
    producer: pokeys_homecomp (if connected)
    consumer: pokeysHal <prefix>.PEv2.I.AxesCommand (HAL_IN)
    consumer_forwarding_to_hardware: NOT IMPLEMENTED — no reachable call path from FUNCTION(_)
    evidence: 'experimental/pokeys_async.c: FUNCTION(_) does not call rt_read_command_pins or any AxesCommand handler (CONFLICT-014)'
- link_id: IK-004
  description: PEv2 AxesState — hardware state from pokeysHal to homecomp
  producer_object: <prefix>.PEv2.I.AxesState
  producer_owner: pokeysHal
  producer_direction: HAL_OUT
  consumer_object: joint.N.PEv2.AxesState
  consumer_owner: pokeys_homecomp
  consumer_direction: HAL_IN
  hal_type: hal_u32_t
  semantic_contract: 'pokeysHal reads the hardware axis state from the PoKeys device and writes it to <prefix>.PEv2.I.AxesState (HAL_OUT). pokeys_homecomp reads this via joint.N.PEv2.AxesState (HAL_IN)
    to drive its homing state machine.

    '
  enum_contract: 'Hardware device states (ePK_PEAxisState): {0,1,2,8,9,10,11,12,13,14,15,16,20,30}. Legacy userspace also defines extended states {3=ReadyToFinalizeHoming, 4=ReadyToArmEncoder, 17=HOMINGARMENCODER,
    18=HOMINGWaitFINALMOVE, 19=HOMINGFINALMOVE} in PEAxisStateEx enum. These may reach the HAL pin if the userspace component writes them; whether pokeys_homecomp interprets them is unverified.

    '
  mapping_scope: HAL/INI configuration
  compatibility_status: partially-compatible
  conflicts: []
  evidence: E-010 (HOMECOMP-006 homecomp side, LA-012 pokeys side)
  current_implementation:
    producer: pokeysHal <prefix>.PEv2.I.AxesState (HAL_OUT)
    consumer: pokeys_homecomp joint.N.PEv2.AxesState (HAL_IN) if connected
    device_hardware: ePK_PEAxisState values written from PK_PEv2_StatusUpdateHALAsync (PoKeysLibPulseEngine_v2Async.c:796)

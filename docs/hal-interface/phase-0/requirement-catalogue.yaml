    update_phase: "device→HAL via PK_ParsePinFunctionsResponse"
    device_field: "device->Pins[j].PinFunction"
    pokeyslib_function: "PK_StartPinFunctionsRequestAsync / PK_ParsePinFunctionsResponse"
    enumeration: "ePK_PinCap: pinRestricted=0, digitalInput=2, digitalOutput=4, analogInput=8, analogOutput=16, triggeredInput=32, digitalCounter=64, invertPin=128"
    bitmap_definition: "Multi-bit bitmap: capability bits ORed together"
    linuxcnc_canonical_status: PoKeys-specific configuration extension
    legacy_compatibility_status: "Issue #222 (LinuxCnc_PokeysLibComp) references PinFunction configuration."
